name: version-pr
# Changesets in VERSION-ONLY mode: maintains a rolling "chore: version +
# changelog" PR that accumulates .changeset/*.md notes from merged feature PRs.
# Merging it bumps package.json + BUS_VERSION in `bus` (via
# scripts/sync-version) and writes CHANGELOG.md — it does NOT release. The tag
# stays behind the maintainer's explicit `gh release create` (docs/RELEASE.md).
# Nothing is ever published to npm.
on:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: changesets/action@v2
        with:
          # v2 renamed every one of these (version/commit/title in v1) and
          # HARD-ERRORS on the old spellings rather than ignoring them, so the
          # v1->v2 bump took the whole job down until this was updated.
          version-script: npm run version
          commit-message: 'chore: version + changelog'
          pr-title: 'chore: version + changelog (merge when ready to stage a release)'
          # Both default to TRUE in v2. Nothing here should ever create a
          # release or push a tag: the tag is the release in this repo, and it
          # is cut by hand by the maintainer (docs/RELEASE.md). These only fire
          # in publish mode — which this job has no publish-script for — but
          # they are pinned anyway, because the cost of being wrong is an
          # automated tag on a build nobody authorized.
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
