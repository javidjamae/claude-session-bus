name: lint
# ShellCheck over every script in the repo. This is the static half of the
# safety net: the suites prove behavior, this catches the shell-specific traps
# that only bite on an unusual input — an unquoted expansion, a loop that word-
# splits a path, a variable that silently masks an exit status.
#
# The ubuntu runner ships shellcheck, so this needs no third-party action and no
# install step: fewer moving parts, and nothing to keep updated.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        # -S warning: style nits stay advisory, anything that can actually
        # misbehave fails the build.
        run: |
          shellcheck --version
          shellcheck -S warning bus bus-filter install.sh scripts/sync-version \
            test/run.sh test/e2e.sh hooks/session-end-leave
